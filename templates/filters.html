<form method="get" class="filters panel">{% if correo_query %}<input type="hidden" name="corte" value="{{ today }}">{% endif %}<div class="filter-grid"><label class="search">Buscar<input name="q" value="{{ f.q }}" placeholder="Tarea, tema, responsable o notas…"></label>{% for field, values in opciones.items %}<label>{% if field == 'responsable_pyp' %}Responsable{% else %}{{ field|capfirst }}{% endif %}<select name="{{ field }}"><option value="">Todos</option>{% for value in values %}<option value="{{ value }}" {% if field == 'tema' and f.tema == value or field == 'iniciativa' and f.iniciativa == value or field == 'responsable_pyp' and f.responsable_pyp == value or field == 'mes' and f.mes == value %}selected{% endif %}>{{ value|default:'Sin definir' }}</option>{% endfor %}</select></label>{% endfor %}<label>Estatus<select name="status"><option value="">Todos</option>{% for e in estados %}<option value="{{ e.codigo }}" {% if f.status == e.codigo %}selected{% endif %}>{{ e.nombre }}</option>{% endfor %}</select></label><label>Situación<select name="situacion"><option value="">Todas</option>{% for s in situaciones %}<option {% if f.situacion == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Año<input name="anio" type="number" min="1" max="9999" value="{{ f.anio }}" placeholder="2026"></label><label>Compromiso HCH<select name="compromiso_hch"><option value="">Todos</option><option value="true" {% if f.compromiso_hch == 'true' %}selected{% endif %}>Sí</option><option value="false" {% if f.compromiso_hch == 'false' %}selected{% endif %}>No</option></select></label><label>Suspendida<select name="suspendida"><option value="">Todas</option><option value="true" {% if f.suspendida == 'true' %}selected{% endif %}>Sí</option><option value="false" {% if f.suspendida == 'false' %}selected{% endif %}>No</option></select></label><label>Objetivo desde<input type="date" name="desde" value="{{ f.desde }}"></label><label>Objetivo hasta<input type="date" name="hasta" value="{{ f.hasta }}"></label></div><div class="filter-actions"><button class="button">Aplicar filtros</button><a href="{{ request.path }}">Limpiar filtros</a>{% if request.path == '/compromisos/' %}<label>Por página <select name="size"><option {% if size == 10 %}selected{% endif %}>10</option><option {% if size == 25 %}selected{% endif %}>25</option><option {% if size == 50 %}selected{% endif %}>50</option><option {% if size == 100 %}selected{% endif %}>100</option></select></label>{% endif %}</div></form>
