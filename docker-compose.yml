services:
  web:
    build: .
    init: true
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ORACLE_PASSWORD_FILE: /app/secrets/oracle_password.txt
      SECRET_KEY_FILE: /app/runtime-config/django_secret_key.txt
    volumes:
      - type: bind
        source: ./secrets
        target: /app/secrets
        read_only: true
      - portal_runtime:/app/runtime-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
volumes:
  portal_runtime:
